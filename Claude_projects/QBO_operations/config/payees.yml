# Owner-entered payee spelling -> QuickBooks Vendor DisplayName.
#
# The sheets are filled in by hand and the owner-payout one carries the BANK's ACH
# label ("VALTA COJI LLC"), while a write payload needs a Vendor Id, which only an
# exact DisplayName resolves.  A name that is neither listed here nor an exact
# DisplayName is a WARN and blocks the post -- never a guess, because a wrong vendor
# is invisible once it is on the books.
#
# Shared by the Zelle expense builder and the owner-payout builder: the same person
# is abbreviated the same way on both sheets, and two maps would drift.

payees:
  Andea: "Andrea Brannon"
  Andrea: "Andrea Brannon"       # the same person, spelled in full on the 09/19 sheet
  Camila: "Camila - service"        # 164 Zelle expenses since March, all to this vendor
  Valta Homes: "Valta Homes LLC"

  # --- expense form stores (the `store` of `store_stuff`; build_form_expenses) --------
  # Matched case-insensitively.  The vendor each card's own feed Expenses already carry
  # (checked 2026-09-24).  A store that is already an exact Vendor name (Target, Walmart,
  # Ace Hardware) needs no row.
  Costco: "Costco Wholesale"
  Amazon: "Amazon.com"
  Home Depot: "The Home Depot"     # 'Home Depot' also exists; the feed uses The Home Depot
  HomeDepot: "The Home Depot"

  # --- owner-payout sheet spellings (Payout_<period>.xlsx) ---------------------
