  Jing Zhou US bank: "Jing Zhou"              # Seatac 12834's label names the RECEIVING
                                              # bank, which is the owner's and changes;
                                              # all three spellings are one Vendor
  The FeifeiFamily Trust: "The Feifei Family Trust"
  VALTA COJI LLC: "Valta Coji L.L.C"
  BAOFU WANG: "Baofu Wang"
  Max O Sigander: "Max Sigander"              # NOT Jessi Sigander, the other Poulsbo 563 owner
  AFN SheltonAdvisorLLC: "AFN Shelton Advisor LLC"
  Suki E: "Suet Ki Poon"                      # Shelton 310's ACH label; Hoodsport 26060 on
