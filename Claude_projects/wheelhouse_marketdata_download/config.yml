app:
  db_path: "./data/wheelhouse.sqlite"
  export_dir: "./data/exports"
  timezone: "America/Los_Angeles"

api:
  base_url: "https://api.usewheelhouse.com/ss_api/v1"
  # Stay comfortably under the ~60 req/min rate limit.
  requests_per_minute: 55
  timeout_seconds: 60
  max_retries: 5

# Request-shaping parameters (see help.usewheelhouse.com "APIs & MCPs").
params:
  country_codes: ["US"]

  # Market selection.
  #   markets_from_listings: true  -> the markets where YOUR listings are
  #     (auto-updates as the portfolio changes). market_names / market_ids are
  #     then ADDITIVE extras — markets you want even with no listing there.
  #   markets_from_listings: false -> market_names / market_ids are the exact list.
  # Names match case-insensitively as substrings against /market_report names
  # ("Seattle" matches "Seattle, WA, United States"). Only markets where you have
  # a Pro listing are accessible; others 404.
  markets_from_listings: true
  market_names:
    - "Wenatchee"           # extra: no listing in-market, but our units are nearby
  market_ids: []            # extra (or exact list) by id

  # How much history to pull for market + dynamic-set time series.
  # Window = Jan 1 of (current year - history_years) .. Dec 31 of the current year.
  # history_years: 2 in 2026 -> 2024-01-01 .. 2026-12-31 (last 2 years + this year).
  history_years: 2
  # Distribution histograms are per-month; pull this many months starting with
  # the snapshot's month (first-of-month is what the API expects).
  distribution_months: 3

# Endpoint path templates (aligned to the Wheelhouse RM API help docs, Jul 2026).
# {listing_id} / {market_id} / {set_id} are filled in per call. If a live call
# 404s, fix the path here only — the code reads every path from this map.
endpoints:
  listings: "/listings"
  listing: "/listings/{listing_id}"

  # Market data
  market_report: "/market_report"
  market_time_series: "/market_report/{market_id}/time_series"
  market_distribution: "/market_report/{market_id}/distribution"

  # Dynamic sets ("dynamite sets") — live under /sets
  dynamic_sets: "/sets"
  dynamic_set: "/sets/{set_id}"
  dynamic_set_associated_listings: "/sets/{set_id}/associated_listings"
  dynamic_set_listings: "/sets/{set_id}/listings"
  dynamic_set_aggregated_metrics: "/sets/{set_id}/aggregated_metrics"
  dynamic_set_time_series: "/sets/{set_id}/time_series"
  dynamic_set_distribution: "/sets/{set_id}/distribution"
  dynamic_set_changelog: "/sets/{set_id}/changelog"
