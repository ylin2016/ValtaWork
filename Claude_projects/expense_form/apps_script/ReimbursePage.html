<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 16px;
           color: #1f2328; background: #fff; max-width: 760px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #656d76; font-size: 14px; margin: 0 0 16px; }
    .person { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .person h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 12px; }
    .muted { color: #656d76; font-weight: normal; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    td { padding: 4px 6px 4px 0; border-top: 1px solid #eee; vertical-align: top; }
    td.num { text-align: right; white-space: nowrap; }
    .bar { position: sticky; bottom: 0; background: #fff; padding: 12px 0; border-top: 1px solid #d0d7de;
           display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    input { font: inherit; padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; }
    button { font: inherit; font-weight: 600; color: #fff; background: #1a7f37; border: 0; border-radius: 6px; padding: 10px 18px; }
    button:disabled { opacity: .5; }
    .msg { padding: 12px; border-radius: 6px; margin: 12px 0; }
    .ok { background: #dafbe1; } .err { background: #ffebe9; }
    .note { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding: 8px 10px;
            background: #f6f8fa; border-radius: 6px; font-size: 14px; }
    .note code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; user-select: all; overflow-wrap: anywhere; }
    .note button { background: #fff; color: #1f2328; border: 1px solid #d0d7de; padding: 4px 12px; font-size: 13px; }
  </style>
</head>
<body>
<? if (error) { ?>
  <div class="msg err"><?= error ?></div>
<? } else { ?>
  <h1>Reimbursements</h1>
  <p class="sub">Approved expenses paid personally and not yet reimbursed.
    <? if (waiting) { ?> <?= waiting ?> more still waiting for review (not shown).<? } ?></p>

  <? if (!groups.length) { ?>
    <div class="msg ok">Nothing to reimburse.</div>
  <? } else { ?>
    <? for (var i = 0; i < groups.length; i++) { var g = groups[i]; ?>
      <div class="person">
        <h2><span><?= g.person ?> <span class="muted">— Zelle to QBO vendor “<?= g.payee ?>”</span></span>
            <span>$<?= g.total ?></span></h2>
        <table>
          <? for (var j = 0; j < g.items.length; j++) { var it = g.items[j]; ?>
            <tr><td>#<?= it.id ?></td><td><?= it.date ?></td><td><?= it.property ?></td>
                <td><?= it.description ?></td><td class="num">$<?= it.amount ?></td></tr>
          <? } ?>
        </table>
        <div class="note"><span class="muted">Zelle note</span>
          <code class="zn" data-tail="<?= g.note_tail ?>"></code>
          <button type="button" onclick="copyNote(this)">Copy</button></div>
      </div>
    <? } ?>
    <div class="bar">
      <span>1. Send each person their Zelle. &nbsp; 2. Then:</span>
      <label>Pay date <input type="date" id="paid" value="<?= today ?>"></label>
      <button id="go" onclick="run()">Mark paid &amp; file receipts</button>
    </div>
    <div id="result"></div>
  <? } ?>
<? } ?>
<script>
  var KEY = <?!= JSON.stringify(key).replace(/</g, '\\u003c') ?>;
  function run() {
    var date = document.getElementById('paid').value;
    if (!confirm('Mark everyone above as paid on ' + date + ' and move their receipts into the bookkeeping folders? Use the same date as the Zelle notes.')) return;
    document.getElementById('go').disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        var lines = r.payouts.map(function (p) { return p.person + ': $' + p.total + ' (' + p.count + ' receipts, note ' + p.reference + ')'; });
        show('ok', 'Done. ' + lines.join(' · '));
        var el = document.getElementById('result'), p = document.createElement('div');
        p.style.marginTop = '8px';
        if (r.csv_url) {
          p.appendChild(document.createTextNode('Ready for QuickBooks: '));
          var a = document.createElement('a'); a.href = r.csv_url; a.target = '_blank'; a.textContent = 'Expense_processing/exports/' + r.csv_name;
          p.appendChild(a);
          p.appendChild(document.createTextNode(' (on the Mac once Drive syncs, usually under a minute).'));
        } else {
          p.textContent = 'The QuickBooks file will be written in about a minute (Expense_processing/exports/zelle_expense2qbo.csv).';
        }
        el.appendChild(p);
      })
      .withFailureHandler(function (e) { show('err', e.message || String(e)); document.getElementById('go').disabled = false; })
      .processReimbursements(KEY, date);
  }
  function notes() {                            // the note starts with the pay date, so it follows the date box
    var el = document.getElementById('paid'); if (!el) return;
    var d = (el.value || '').replace(/-/g, '');
    document.querySelectorAll('.zn').forEach(function (c) { c.textContent = d + '_' + c.getAttribute('data-tail'); });
  }
  function copyNote(btn) {
    var code = btn.parentNode.querySelector('.zn'), text = code.textContent;
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { selectIt(code); });
    else selectIt(code);
  }
  function selectIt(el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  var paidBox = document.getElementById('paid');
  if (paidBox) { paidBox.addEventListener('input', notes); paidBox.addEventListener('change', notes); notes(); }
  function show(cls, text) {
    var el = document.getElementById('result');
    el.className = 'msg ' + cls;
    el.textContent = text;
  }
</script>
</body>
</html>
